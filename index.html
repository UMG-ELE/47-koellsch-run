  <script>
    (()=>{
      const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d'),audio=$('music'),overlay=$('overlay'),card=$('card'),scoreEl=$('score'),coinsEl=$('coins'),bestEl=$('best'),paceEl=$('pace'),warningEl=$('warning'),pauseBtn=$('pause'),soundBtn=$('sound'),trackBtn=$('track-control'),trackState=$('track-state'),controls=$('controls');
      let mode='ready',best=0,score=0,coins=0,muted=false,w=0,h=0,last=0,elapsed=0,distance=0,lane=1,target=1,jump=0,slide=0,nextWave=62,wave=0,nextId=1,entities=[],lastHud=0,swipeStart=null;

        if(m==='ready')card.innerHTML='<p class="kicker">Hohenzollernbrücke · Köln</p><h1>LAUF DEINEN<br><em>FILM.</em></h1><p class="copy">Der Dom leuchtet. Die Nacht gehört dir. Wie weit kommst du?</p><button class="start" data-start>RUN STARTEN <span>↗</span></button><p class="note">♪ 11/11 Aura läuft während deines Runs</p><p class="gesture-note">Wischen: links/rechts Spur wechseln · hoch springen · runter ducken</p><div class="hints"><span>← → <b>SPUR</b></span><span>↑ <b>SPRINGEN</b></span><span>↓ <b>DUCKEN</b></span></div>';

      }
      function playMusic(restart=false){if(restart){try{audio.currentTime=0}catch{}}trackState.textContent='LÄDT…';trackBtn.title='11/11 Aura · Musik abspielen oder pausieren';audio.play().catch(()=>{trackState.textContent='FEHLER';trackBtn.title='Audio konnte nicht gestartet werden. Klicke erneut, um es zu versuchen.'})}

      function start(){lane=target=1;jump=slide=elapsed=distance=coins=score=0;nextWave=62;wave=0;entities=[];nextId=1;lastHud=0;scoreEl.textContent='0';coinsEl.textContent='00';paceEl.textContent='1,0×';show('running');playMusic(true)}
      function action(a){if(mode!=='running')return;if(a==='left')target=Math.max(0,target-1);if(a==='right')target=Math.min(2,target+1);if(a==='jump'){jump=.82;slide=0}if(a==='slide'){slide=.72;jump=0}}
      function add(kind,l,z){entities.push({kind,l,z,done:false,id:nextId++})}
      function spawn(){const l=Math.floor(Math.random()*3);if(wave%4===3){const cl=Math.floor(Math.random()*3);for(let i=0;i<6;i++)add('coin',cl,88-i*6)}else{add(['barrier','tram','beam'][Math.floor(Math.random()*3)],l,88);const cl=(l+1+Math.floor(Math.random()*2))%3;for(let i=0;i<5;i++)add('coin',cl,64-i*5)}wave++;nextWave+=52+Math.random()*14}
      function rr(x,y,a,b,r){ctx.beginPath();ctx.roundRect(x,y,a,b,r);ctx.fill()}
      function cathedral(x,base,s){ctx.save();ctx.translate(x,base);ctx.scale(s,s);ctx.fillStyle='#211c37';ctx.fillRect(-94,-116,188,116);for(const t of [-69,69]){ctx.fillRect(t-28,-224,56,224);ctx.beginPath();ctx.moveTo(t-34,-224);ctx.lineTo(t,-321);ctx.lineTo(t+34,-224);ctx.fill();ctx.fillRect(t-35,-230,70,9);ctx.strokeStyle='#39304e';ctx.lineWidth=5;for(const d of [-15,15]){ctx.beginPath();ctx.moveTo(t+d,-203);ctx.lineTo(t+d,-126);ctx.stroke()}}ctx.fillStyle='#efa970';for(const xw of [-52,0,52]){ctx.beginPath();ctx.arc(xw,-77,12,Math.PI,0);ctx.lineTo(xw+12,-36);ctx.lineTo(xw-12,-36);ctx.fill()}ctx.restore()}
      function sky(){const hy=h*.47,g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#15132e');g.addColorStop(.54,'#48305f');g.addColorStop(1,'#ee936c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff2cd';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(w*.82,h*.16,Math.min(w,h)*.027,0,7);ctx.fill();ctx.globalAlpha=1;
        for(let i=0;i<22;i++){ctx.globalAlpha=.28+(i*17%50)/100;ctx.fillStyle='#fff5d7';ctx.fillRect(i*173.7%w+Math.sin(elapsed*.35+i)*2,i*47.3%(hy*.72),i%3?1:2,i%3?1:2)}ctx.globalAlpha=1;ctx.fillStyle='#352543';for(let i=0;i<20;i++){const bw=w*(.025+i%3*.008),x=i/20*w,bh=h*(.055+(i*13%8)*.012);ctx.fillRect(x,hy-bh,bw,bh);ctx.fillStyle='#f2b36f';ctx.globalAlpha=.52;for(let j=0;j<3;j++)ctx.fillRect(x+bw*(.2+j%2*.38),hy-bh+12+j*15,3,4);ctx.globalAlpha=1;ctx.fillStyle='#352543'}
        ctx.strokeStyle='#2a213d';ctx.lineWidth=Math.max(2,w*.003);ctx.beginPath();ctx.moveTo(0,hy-h*.045);ctx.quadraticCurveTo(w*.26,hy-h*.11,w*.48,hy-h*.035);ctx.moveTo(w*.54,hy-h*.035);ctx.quadraticCurveTo(w*.78,hy-h*.12,w,hy-h*.045);ctx.stroke();for(let i=0;i<14;i++){const x=i/13*w;ctx.beginPath();ctx.moveTo(x,hy-h*.065);ctx.lineTo(x,hy+h*.005);ctx.stroke()}cathedral(w*.51,hy+h*.04,Math.min(w/1120,h/740)*.72+.34)}

      function speedNow(){return 13+Math.min(8,elapsed*.45)}
      function road(){const c=w*.5,hy=h*.485,g=ctx.createLinearGradient(0,hy,0,h);g.addColorStop(0,'#383348');g.addColorStop(1,'#171923');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(c-w*.035,hy);ctx.lineTo(c+w*.035,hy);ctx.lineTo(w*.97,h);ctx.lineTo(w*.03,h);ctx.fill();ctx.strokeStyle='#ffab8780';ctx.lineWidth=2;for(const e of [-1,1]){ctx.beginPath();ctx.moveTo(c+e*w*.036,hy);ctx.lineTo(c+e*w*.47,h);ctx.stroke()}
        for(const d of [-.5,.5])for(let i=0;i<12;i++){const phase=(i/12+distance*.016%1)%1,p=phase*phase,y=hy+p*(h-hy),x=c+d*w*(.07+p*.47);ctx.globalAlpha=.25+p*.55;ctx.fillStyle='#ffe1c4';rr(x-1.5-p*2,y,3+p*4,4+p*h*.045,5)}ctx.globalAlpha=1;for(let i=0;i<9;i++){const ph=(i/9+distance*.009%1)%1,p=ph*ph,y=hy+p*(h-hy),xo=w*(.045+p*.43),s=2+p*5;for(const side of [-1,1]){ctx.globalAlpha=.2+p*.65;ctx.fillStyle='#ffbd77';ctx.beginPath();ctx.arc(c+side*xo,y,s,0,7);ctx.fill()}}ctx.globalAlpha=1}
      function token(x,y,s){const gh=s*1.9,gw=s*.82,bob=Math.sin(elapsed*4+x)*s*.08;y+=bob;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(elapsed*2+x)*.045);ctx.shadowColor='#ffc95b';ctx.shadowBlur=s*.7;const beer=ctx.createLinearGradient(-gw/2,0,gw/2,0);beer.addColorStop(0,'#d47c27');beer.addColorStop(.35,'#ffd66c');beer.addColorStop(1,'#e99a35');ctx.fillStyle=beer;ctx.beginPath();ctx.moveTo(-gw*.43,-gh*.46);ctx.lineTo(gw*.43,-gh*.46);ctx.lineTo(gw*.34,gh*.48);ctx.lineTo(-gw*.34,gh*.48);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff0d2';ctx.beginPath();ctx.ellipse(0,-gh*.34,gw*.39,gh*.12,0,0,7);ctx.fill();const badgeH=gh*.38,badgeW=gw*.72,badgeY=gh*.08;ctx.fillStyle='#39251e';ctx.beginPath();ctx.ellipse(0,badgeY,badgeW*.54,badgeH*.56,0,0,7);ctx.fill();ctx.fillStyle='#c69a51';ctx.beginPath();ctx.ellipse(0,badgeY,badgeW*.48,badgeH*.5,0,0,7);ctx.fill();ctx.fillStyle='#a9232b';ctx.beginPath();ctx.ellipse(0,badgeY,badgeW*.41,badgeH*.43,0,0,7);ctx.fill();ctx.fillStyle='#f4e5c2';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${Math.max(4,s*.16)}px Georgia,serif`;ctx.fillText('R',0,badgeY-badgeH*.16);if(s>=20){ctx.font=`bold ${Math.max(2.2,s*.095)}px Georgia,serif`;ctx.fillText('Reissdorf',0,badgeY+badgeH*.13);ctx.fillText('Kölsch',0,badgeY+badgeH*.31)}ctx.strokeStyle='#f9f2e2';ctx.lineWidth=Math.max(1,s*.1);ctx.beginPath();ctx.moveTo(-gw*.43,-gh*.46);ctx.lineTo(-gw*.34,gh*.48);ctx.quadraticCurveTo(0,gh*.54,gw*.34,gh*.48);ctx.lineTo(gw*.43,-gh*.46);ctx.stroke();ctx.beginPath();ctx.moveTo(-gw*.46,-gh*.46);ctx.lineTo(gw*.46,-gh*.46);ctx.stroke();ctx.strokeStyle='#fff9e8';ctx.globalAlpha=.82;ctx.lineWidth=Math.max(1,s*.07);ctx.beginPath();ctx.moveTo(-gw*.25,-gh*.19);ctx.lineTo(-gw*.19,gh*.32);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#fff3ce';for(let i=0;i<2;i++){ctx.beginPath();ctx.arc((i?1:-1)*gw*.09,gh*(.05+i*.2),Math.max(.7,s*.045),0,7);ctx.fill()}ctx.restore()}
      function obstacle(e,x,y,s){ctx.save();if(e.kind==='barrier'){const bw=s*1.45,bh=s*.72;ctx.fillStyle='#271f2e';ctx.fillRect(x-bw*.42,y-bh*.1,s*.17,bh*.85);ctx.fillRect(x+bw*.25,y-bh*.1,s*.17,bh*.85);ctx.fillStyle='#ff704f';rr(x-bw/2,y-bh,bw,bh*.7,s*.1);ctx.fillStyle='#ffe29a';for(let i=0;i<4;i++)ctx.fillRect(x-bw*.35+i*bw*.25,y-bh*.66,s*.11,bh*.26)}else if(e.kind==='beam'){const bw=s*1.55;ctx.fillStyle='#2be0d0';ctx.shadowColor='#2be0d0';ctx.shadowBlur=s*.45;ctx.fillRect(x-bw/2,y-s*.92,bw,s*.16);ctx.shadowBlur=0;ctx.fillStyle='#20333a';ctx.fillRect(x-bw/2,y-s*.92,s*.12,s*.95);ctx.fillRect(x+bw/2-s*.12,y-s*.92,s*.12,s*.95)}else{const bw=s*1.38,bh=s*1.42;ctx.fillStyle='#e85c56';rr(x-bw/2,y-bh,bw,bh,s*.18);ctx.fillStyle='#fae2bd';rr(x-bw*.36,y-bh*.78,bw*.72,bh*.35,s*.09);ctx.fillStyle='#6bb7af';for(const o of [-.21,.04,.29])ctx.fillRect(x+bw*o,y-bh*.72,bw*.12,bh*.2);ctx.fillStyle='#ffdf9a';ctx.beginPath();ctx.arc(x-bw*.28,y-s*.13,s*.08,0,7);ctx.arc(x+bw*.28,y-s*.13,s*.08,0,7);ctx.fill()}ctx.restore()}
      function runner(){const jp=jump>0?1-jump/.82:0,lift=jump>0?Math.sin(jp*Math.PI)*h*.12:0,ground=h*.91,x=lx(lane,.92),y=ground-lift,s=Math.max(25,h*.13),crouch=slide>0?.66:1,cycle=Math.sin(elapsed*13);ctx.globalAlpha=.35;ctx.fillStyle='#080912';ctx.beginPath();ctx.ellipse(x,ground,s*.48,s*.13,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.save();ctx.translate(x,y);ctx.scale(s,s*crouch);ctx.strokeStyle='#f0c67f';ctx.lineWidth=.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-.13,-.44);ctx.lineTo(-.19+cycle*.08,-.1);ctx.lineTo(-.31+cycle*.18,.02);ctx.moveTo(.13,-.44);ctx.lineTo(.2-cycle*.08,-.12);ctx.lineTo(.3-cycle*.18,.02);ctx.stroke();ctx.strokeStyle='#b95749';ctx.lineWidth=.09;ctx.beginPath();ctx.moveTo(-.31+cycle*.18,.02);ctx.lineTo(-.22+cycle*.18,.02);ctx.moveTo(.3-cycle*.18,.02);ctx.lineTo(.39-cycle*.18,.02);ctx.stroke();ctx.fillStyle='#49c7a7';rr(-.25,-.9,.5,.51,.14);ctx.fillStyle='#f2ba8e';ctx.beginPath();ctx.arc(0,-1.03,.2,0,7);ctx.fill();ctx.fillStyle='#29223b';ctx.beginPath();ctx.arc(0,-1.09,.205,Math.PI,7);ctx.lineTo(.19,-1.02);ctx.lineTo(-.18,-1.02);ctx.fill();ctx.fillStyle='#e9f8df';ctx.font='bold .15px Arial';ctx.textAlign='center';ctx.fillText('47',0,-.66);ctx.restore()}
      function cue(e,x,y,s){const label=e.kind==='barrier'?'↑ SPRINGEN':e.kind==='beam'?'↓ DUCKEN':'↔ WECHSELN';ctx.save();ctx.font='bold 11px Arial';const bw=Math.max(67,ctx.measureText(label).width+16),bh=23,cx=x,cy=y-s*1.35-bh;ctx.globalAlpha=.84+.12*Math.sin(elapsed*9);ctx.fillStyle='#21172cf0';ctx.strokeStyle='#ffd166';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(cx-bw/2,cy,bw,bh,7);ctx.fill();ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#fff3d9';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,cx,cy+bh/2);ctx.restore()}
      function updateWarning(speed){const next=entities.filter(e=>!e.done&&e.kind!=='coin'&&e.z<=56&&e.z>0).sort((a,b)=>a.z-b.z)[0];if(!next){warningEl.hidden=true;warningEl.classList.remove('urgent');warningEl.dataset.key='';return}const eta=Math.max(0,Math.ceil((next.z-10)/speed)),laneName=['LINKS','MITTE','RECHTS'][next.l],actionName=next.kind==='barrier'?'SPRINGEN':next.kind==='beam'?'DUCKEN':'SPUR WECHSELN',icon=next.kind==='barrier'?'↑':next.kind==='beam'?'↓':'↔',stamp=`${eta}|${next.l}|${next.kind}`;if(warningEl.dataset.key!==stamp){warningEl.dataset.key=stamp;warningEl.innerHTML=`<span class="warning-icon">${icon}</span><span>${eta===0?'JETZT':`IN ${eta}S`} · ${laneName} · ${actionName}</span>`}warningEl.classList.toggle('urgent',eta<=1);warningEl.hidden=false}
      function draw(){sky();road();for(const e of [...entities].sort((a,b)=>b.z-a.z)){const p=Math.max(0,Math.min(1,1-e.z/96));if(!p||p>=1)continue;const q=p**1.72,y=h*.485+q*h*.515,x=lx(e.l,q),s=(h*.035+q*h*.105)*(w<540?.92:1);if(e.kind==='coin')token(x,y-s*.52,s*.38);else{obstacle(e,x,y,s);if(e.z<=56&&e.z>0)cue(e,x,y,s)}}runner()}
      function resize(){const b=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=b.width;h=b.height;canvas.width=Math.floor(w*d);canvas.height=Math.floor(h*d);ctx.setTransform(d,0,0,d,0,0)}
      function finish(){score=Math.floor(distance*12)+coins*50;best=Math.max(best,score);try{localStorage.setItem('koell-run-best',String(best))}catch{}scoreEl.textContent=score.toLocaleString('de-DE');coinsEl.textContent=String(coins).padStart(2,'0');bestEl.textContent=best.toLocaleString('de-DE');show('over');audio.pause()}
      function tick(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(mode==='running'){elapsed+=dt;distance+=dt*speedNow();const speed=speedNow();lane+=(target-lane)*Math.min(1,dt*12);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);while(distance>=nextWave)spawn();for(const e of entities){e.z-=dt*speed;if(e.done||e.z>10)continue;e.done=true;const same=Math.abs(lane-e.l)<.43;if(e.kind==='coin'){if(same)coins++}else if(same&&!((e.kind==='barrier'&&jump>.1)||(e.kind==='beam'&&slide>.08))){finish();break}}entities=entities.filter(e=>e.z>-10);if(mode==='running')updateWarning(speed);if(t-lastHud>180&&mode==='running'){lastHud=t;score=Math.floor(distance*12)+coins*50;scoreEl.textContent=score.toLocaleString('de-DE');coinsEl.textContent=String(coins).padStart(2,'0');paceEl.textContent=(speed/13).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+'×'}}draw();requestAnimationFrame(tick)}
      overlay.addEventListener('click',e=>{if(e.target.closest('[data-start]'))start();if(e.target.closest('[data-resume]')){show('running');playMusic()}});pauseBtn.addEventListener('click',()=>{if(mode==='running'){show('paused');audio.pause()}else if(mode==='paused'){show('running');playMusic()}});trackBtn.addEventListener('click',()=>{if(audio.paused)playMusic();else audio.pause()});soundBtn.addEventListener('click',()=>{muted=!muted;audio.muted=muted;soundBtn.textContent=muted?'♫̸':'♫'});controls.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();action(b.dataset.action)}});
      canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'||mode!=='running')return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y,threshold=Math.max(24,Math.min(48,w*.07));swipeStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<threshold)return;e.preventDefault();if(Math.abs(dx)>Math.abs(dy))action(dx<0?'left':'right');else action(dy<0?'jump':'slide')});canvas.addEventListener('pointercancel',()=>{swipeStart=null});
      window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if((k==='enter'||k===' ')&&(mode==='ready'||mode==='over')){start();return}if((k==='enter'||k===' ')&&mode==='paused'){show('running');playMusic();return}if(k==='escape'||k==='p'){if(mode==='running'){show('paused');audio.pause()}else if(mode==='paused'){show('running');playMusic()}return}if(k==='arrowleft'||k==='a')action('left');if(k==='arrowright'||k==='d')action('right');if(k==='arrowup'||k==='w')action('jump');if(k==='arrowdown'||k==='s')action('slide')},{passive:false});
      new ResizeObserver(resize).observe(canvas);resize();show('ready');requestAnimationFrame(tick);window.addEventListener('pagehide',()=>audio.pause());
    })();
  </script>
